name: Deploy Yeabsra Christian Engagement

on:
  push:
    branches: [main]
    paths:
      - "yeabsrachristian/**"
      - ".github/workflows/deploy-yeabsrachristian.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yeabsrachristian
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy invitation with cPanel API
        env:
          CPANEL_HOST: menaincet.com
          CPANEL_USER: menainpy
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
          CPANEL_TARGET_DIR: /home/menainpy/public_html/yeabsrachristian
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const host = process.env.CPANEL_HOST;
          const user = process.env.CPANEL_USER;
          const token = process.env.CPANEL_TOKEN;
          const targetDir = process.env.CPANEL_TARGET_DIR;
          const headers = { Authorization: `cpanel ${user}:${token}` };

          if (!token) throw new Error('Missing CPANEL_TOKEN secret');

          async function cpanel(pathname, params = {}) {
            const url = new URL(`https://${host}:2083${pathname}`);
            for (const [key, value] of Object.entries(params)) url.searchParams.set(key, value);
            const response = await fetch(url, { headers });
            const json = await response.json();
            if (!response.ok || json.status === 0 || json?.cpanelresult?.event?.result === 0) {
              throw new Error(JSON.stringify(json.errors || json?.cpanelresult?.event?.reason || json));
            }
            return json;
          }

          async function ensureDir(parent, name) {
            await cpanel('/json-api/cpanel', {
              cpanel_jsonapi_apiversion: '2',
              cpanel_jsonapi_module: 'Fileman',
              cpanel_jsonapi_func: 'mkdir',
              path: parent,
              name,
              permissions: '0755'
            }).catch(() => {});
          }

          async function saveTextFile(dir, file, content) {
            const form = new URLSearchParams();
            form.set('dir', dir);
            form.set('file', file);
            form.set('content', content);
            form.set('from_charset', 'UTF-8');
            form.set('to_charset', 'UTF-8');
            const response = await fetch(`https://${host}:2083/execute/Fileman/save_file_content`, {
              method: 'POST',
              headers: { ...headers, 'Content-Type': 'application/x-www-form-urlencoded' },
              body: form
            });
            const json = await response.json();
            if (!response.ok || !json.status) throw new Error(JSON.stringify(json.errors || json));
          }

          async function downloadLiveAsset(file) {
            const assetPath = path.join('assets', file);
            if (fs.existsSync(assetPath)) return;
            const response = await fetch(`https://menaincet.com/yeabsrachristian/assets/${file}`);
            if (!response.ok) throw new Error(`Could not download live asset ${file}: ${response.status}`);
            const bytes = Buffer.from(await response.arrayBuffer());
            fs.writeFileSync(assetPath, bytes);
          }

          async function downloadLiveText(file) {
            if (fs.existsSync(file)) return;
            const response = await fetch(`https://menaincet.com/yeabsrachristian/${file}`);
            if (!response.ok) throw new Error(`Could not download live file ${file}: ${response.status}`);
            fs.writeFileSync(file, await response.text(), 'utf8');
          }

          await ensureDir('/home/menainpy/public_html', 'yeabsrachristian');
          await ensureDir(targetDir, 'assets');
          await ensureDir(targetDir, 'api');
          await ensureDir(targetDir, 'admin');
          fs.mkdirSync('assets', { recursive: true });
          await Promise.all([
            'butterfly-crop.png',
            'couple.jpg',
            'doves-fast-hq.webp',
            'doves-fast.webm',
            'doves-fast.webp',
            'doves-mobile-hq.webp',
            'doves-mobile.webm',
            'doves-mobile.webp',
            'doves-poster.webp',
            'envelope-closed.jpg',
            'envelope-open.jpg',
            'flower-petal.png'
          ].map(downloadLiveAsset));
          await downloadLiveText('support.js');
          await saveTextFile(targetDir, 'index.html', fs.readFileSync('index.html', 'utf8'));
          await saveTextFile(targetDir, 'support.js', fs.readFileSync('support.js', 'utf8'));
          await saveTextFile(`${targetDir}/api`, 'photos.php', fs.readFileSync('api/photos.php', 'utf8'));
          await saveTextFile(`${targetDir}/admin`, 'index.html', fs.readFileSync('admin/index.html', 'utf8'));
          NODE
          curl --fail-with-body --show-error --silent \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            -F "dir=${CPANEL_TARGET_DIR}/assets" \
            -F "overwrite=1" \
            -F "file-1=@assets/butterfly-crop.png" \
            -F "file-2=@assets/couple.jpg" \
            -F "file-3=@assets/doves-fast-hq.webp" \
            -F "file-4=@assets/doves-fast.webm" \
            -F "file-5=@assets/doves-fast.webp" \
            -F "file-6=@assets/doves-mobile-hq.webp" \
            -F "file-7=@assets/doves-mobile.webm" \
            -F "file-8=@assets/doves-mobile.webp" \
            -F "file-9=@assets/doves-poster.webp" \
            -F "file-10=@assets/envelope-closed.jpg" \
            -F "file-11=@assets/envelope-open.jpg" \
            -F "file-12=@assets/flower-petal.png" \
            -F "file-13=@assets/yeabsra-christian-engagement.ics" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/upload_files"
