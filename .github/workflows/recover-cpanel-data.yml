name: Recover cPanel Data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-cpanel-data.yml"

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Recover shop data files
        env:
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
          CPANEL_URL: ${{ secrets.CPANEL_URL }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
        run: |
          set -euo pipefail
          base_url="${CPANEL_URL:-}"
          if [ -z "${base_url}" ]; then
            host="${CPANEL_HOST:-cpanel.menaincet.com}"
            port="${CPANEL_PORT:-2083}"
            base_url="https://${host}:${port}"
          fi
          base_url="${base_url%/}"
          mkdir -p recovered-cpanel-data

          list_json="$(curl --fail-with-body --show-error --silent --get \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            --data-urlencode "dir=mena-shop-app-v2/server" \
            "${base_url}/execute/Fileman/list_files")"
          printf '%s\n' "${list_json}" > recovered-cpanel-data/file-list.json

          printf '%s' "${list_json}" | jq -r '
            (.data // [])
            | map(.file // .name // empty)
            | map(select(test("^dev-data(\\.corrupt-.*)?\\.json$")))
            | .[]
          ' > recovered-cpanel-data/files-to-fetch.txt

          while IFS= read -r file; do
            [ -n "${file}" ] || continue
            echo "Fetching ${file}"
            curl --fail-with-body --show-error --silent --get \
              -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
              --data-urlencode "dir=mena-shop-app-v2/server" \
              --data-urlencode "file=${file}" \
              "${base_url}/execute/Fileman/get_file_content" \
              > "recovered-cpanel-data/${file}.response.json"
          done < recovered-cpanel-data/files-to-fetch.txt

      - name: Upload recovered data artifact
        uses: actions/upload-artifact@v4
        with:
          name: recovered-cpanel-data
          path: recovered-cpanel-data
          retention-days: 1
