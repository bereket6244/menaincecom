<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guest Photo Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&amp;family=Pinyon+Script&amp;display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; min-height: 100%; background: #F1E7D3; color: #4A4036; font-family: "Cormorant Garamond", serif; scrollbar-color: #A08464 #EFE1C7; scrollbar-width: thin; }
  ::-webkit-scrollbar { width: 12px; height: 0; }
  ::-webkit-scrollbar-track { background: #EFE1C7; }
  ::-webkit-scrollbar-thumb { background: #A08464; border: 3px solid #EFE1C7; border-radius: 999px; }
  main { min-height: 100vh; padding: 70px 24px 90px; box-sizing: border-box; background: radial-gradient(ellipse at 50% 10%, #F8F0DF 0%, #F1E7D3 58%, #EADCC2 100%); }
  .shell { width: min(1120px, 100%); margin: 0 auto; }
  .title { text-align: center; line-height: 1; }
  .title .small { font-size: 28px; letter-spacing: 0.42em; text-indent: 0.42em; color: #6E5B49; }
  .title .script { font-family: "Pinyon Script", cursive; font-size: clamp(48px, 8vw, 72px); color: #8A6B4C; margin-top: -4px; }
  .panel { margin: 46px auto 0; width: min(520px, 100%); border: 1px solid #BCA987; background: rgba(250, 246, 238, 0.45); padding: 24px; box-sizing: border-box; text-align: center; }
  input { width: 100%; box-sizing: border-box; border: 1px solid #BCA987; background: #FBF5E9; color: #4A4036; padding: 13px 14px; font: 18px "Cormorant Garamond", serif; text-align: center; }
  button, .button { font-family: "Cormorant Garamond", serif; border: 1px solid #A38044; border-radius: 999px; background: rgba(250, 246, 238, 0.5); padding: 12px 22px; color: #8A6B4C; letter-spacing: 0.22em; text-indent: 0.22em; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; min-height: 42px; box-sizing: border-box; }
  button:disabled { opacity: 0.48; cursor: wait; }
  .toolbar { display: none; align-items: center; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 36px; }
  .status { min-height: 24px; margin-top: 18px; text-align: center; color: #8B7A66; font-style: italic; font-size: 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px; margin-top: 36px; }
  .card { border: 1px solid #BCA987; background: linear-gradient(145deg, #FBF5E9 0%, #EFE1C7 100%); padding: 10px; box-shadow: 0 18px 42px rgba(74, 64, 54, 0.1); }
  .card.hidden img { opacity: 0.58; }
  .card.deleted img { opacity: 0.38; filter: grayscale(0.55); }
  .card img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; display: block; border: 1px solid rgba(160, 132, 100, 0.38); }
  .meta { padding: 12px 4px 2px; display: flex; flex-direction: column; gap: 10px; align-items: center; color: #8B7A66; font-style: italic; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .actions button, .actions .photo-download { padding: 9px 14px; min-height: 36px; font-size: 13px; }
  .empty { margin-top: 46px; text-align: center; color: #8B7A66; font-style: italic; font-size: 20px; }
</style>
</head>
<body>
<main>
  <div class="shell">
    <div class="title">
      <div class="small">PHOTO</div>
      <div class="script">admin</div>
    </div>

    <form id="login" class="panel">
      <input id="admin-key" type="password" autocomplete="current-password" placeholder="Admin passcode">
      <button style="margin-top: 16px;" type="submit">OPEN ADMIN</button>
    </form>

    <div id="toolbar" class="toolbar">
      <a id="download-all" class="button" href="#">DOWNLOAD ALL</a>
      <button id="hide-all" type="button">HIDE ALL</button>
      <button id="show-all" type="button">SHOW ALL</button>
      <button id="delete-all" type="button">DELETE ALL</button>
    </div>

    <div id="status" class="status"></div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" hidden>No guest photos yet.</div>
  </div>
</main>
<script>
(() => {
  const apiUrl = '../api/photos.php';
  const keyName = 'yeabsra-christian-gallery-admin-key';
  const login = document.getElementById('login');
  const input = document.getElementById('admin-key');
  const toolbar = document.getElementById('toolbar');
  const status = document.getElementById('status');
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const downloadAll = document.getElementById('download-all');
  let adminKey = sessionStorage.getItem(keyName) || '';
  let photos = [];

  function setStatus(message) {
    status.textContent = message || '';
  }

  function formatDate(value) {
    return new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }).format(new Date(value));
  }

  async function api(method, payload = {}) {
    const response = await fetch(apiUrl, {
      method,
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify({ ...payload, adminKey })
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || 'Admin request failed.');
    return data;
  }

  async function load() {
    setStatus('Loading photos...');
    const response = await fetch(apiUrl + '?admin_key=' + encodeURIComponent(adminKey), { headers: { Accept: 'application/json' } });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || 'Could not load admin gallery.');
    photos = Array.isArray(data.photos) ? data.photos : [];
    sessionStorage.setItem(keyName, adminKey);
    login.style.display = 'none';
    toolbar.style.display = 'flex';
    downloadAll.href = apiUrl + '?download=zip&admin_key=' + encodeURIComponent(adminKey);
    render();
    setStatus('');
  }

  function render() {
    grid.innerHTML = '';
    empty.hidden = photos.length !== 0;
    photos.forEach(photo => {
      const card = document.createElement('article');
      card.className = 'card' + (photo.hidden ? ' hidden' : '') + (photo.deleted ? ' deleted' : '');
      const state = photo.deleted ? ' - deleted' : (photo.hidden ? ' - hidden' : '');
      card.innerHTML = '<img alt="Guest photo" src="' + photo.src + '"><div class="meta"><span>' + formatDate(photo.createdAt) + state + '</span><div class="actions"></div></div>';
      const actions = card.querySelector('.actions');
      const download = document.createElement('a');
      download.className = 'button photo-download';
      download.textContent = 'DOWNLOAD';
      download.href = apiUrl + '?download=photo&id=' + encodeURIComponent(photo.id) + '&admin_key=' + encodeURIComponent(adminKey);
      download.download = 'yeabsra-christian-photo.jpg';
      const hide = document.createElement('button');
      hide.type = 'button';
      hide.textContent = photo.hidden ? 'SHOW' : 'HIDE';
      hide.disabled = photo.deleted;
      hide.addEventListener('click', async () => {
        hide.disabled = true;
        const nextHidden = !photo.hidden;
        photo.hidden = nextHidden;
        render();
        await api('PATCH', { id: photo.id, hidden: nextHidden });
        await load();
      });
      const del = document.createElement('button');
      del.type = 'button';
      del.textContent = photo.deleted ? 'DELETED' : 'DELETE';
      del.disabled = photo.deleted;
      del.addEventListener('click', async () => {
        if (!confirm('Delete this photo?')) return;
        del.disabled = true;
        del.textContent = 'DELETING';
        photo.deleted = true;
        render();
        try {
          await api('DELETE', { id: photo.id });
          await load();
        } catch (error) {
          setStatus(error.message);
          await load();
        }
      });
      actions.append(download, hide, del);
      grid.appendChild(card);
    });
  }

  login.addEventListener('submit', async event => {
    event.preventDefault();
    adminKey = input.value.trim();
    if (!adminKey) return;
    try { await load(); }
    catch (error) { setStatus(error.message); }
  });

  document.getElementById('hide-all').addEventListener('click', async () => {
    await api('PATCH', { all: true, hidden: true });
    await load();
  });
  document.getElementById('show-all').addEventListener('click', async () => {
    await api('PATCH', { all: true, hidden: false });
    await load();
  });
  document.getElementById('delete-all').addEventListener('click', async () => {
    if (!confirm('Delete all guest photos?')) return;
    photos = photos.map(photo => ({ ...photo, deleted: true }));
    render();
    setStatus('Deleting photos...');
    await api('DELETE', { all: true });
    await load();
  });

  if (adminKey) load().catch(() => sessionStorage.removeItem(keyName));
})();
</script>
</body>
</html>
